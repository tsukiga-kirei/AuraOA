openapi: 3.0.3
info:
  title: AuraOA API
  version: 0.1.0
  description: 'AuraOA 平台 API 契约。与 docs/api/*.md 互补：Markdown 保留叙述性说明，本文件供机器读取与 IDE 预览。


    统一响应：{ code, message, data }，成功时 code=0。

    服务端分页：data 含 items、total、page、page_size。

    角色：system_admin | tenant_admin | business（JWT 内 active_role 决定权限）。'
servers:
- url: http://localhost:8080
  description: 本地开发环境
tags:
- name: Health
  description: 健康检查
- name: Auth
  description: 认证与登录
- name: Notifications
  description: 站内通知
- name: Org
  description: 租户组织架构
- name: SystemAdmin
  description: 系统管理员
- name: Cache
  description: 缓存管理
- name: AuditConfig
  description: 流程审核配置
- name: ArchiveConfig
  description: 归档复盘配置
- name: SummaryConfig
  description: 流程总结配置
- name: Cron
  description: 定时任务
- name: UserSettings
  description: 用户个人设置
- name: UserConfigMgmt
  description: 租户用户配置管理
- name: LLMLogs
  description: AI 调用记录与 Token 统计
- name: Audit
  description: 审核工作台
- name: Summary
  description: 流程总结数据管理
- name: Archive
  description: 归档复盘
- name: Embed
  description: OA 嵌入页
paths:
  /api/health:
    get:
      summary: 服务健康检查
      tags:
      - Health
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      status:
                        type: string
  /api/auth/bootstrap-status:
    get:
      summary: 获取系统初始化状态
      tags:
      - Auth
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      needs_setup:
                        type: boolean
  /api/auth/bootstrap:
    post:
      summary: 初始化首个系统管理员
      tags:
      - Auth
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: success
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - password
              - display_name
              properties:
                username:
                  type: string
                password:
                  type: string
                  minLength: 8
                display_name:
                  type: string
  /api/auth/login:
    post:
      summary: 用户登录
      tags:
      - Auth
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/LoginResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /api/auth/refresh:
    post:
      summary: 刷新 Access Token
      tags:
      - Auth
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
  /api/auth/sso/basic-redirection:
    get:
      summary: OA 服务端使用 Basic 凭据换取一次性浏览器登录地址
      tags:
      - Auth
      security:
      - basicAuth: []
      parameters:
      - name: portal
        in: query
        schema:
          type: string
          enum: [business, tenant_admin]
          default: business
      responses:
        '302':
          description: 换址成功；Location 指向 60 秒内有效且仅可消费一次的登录地址
          headers:
            Location:
              schema:
                type: string
                format: uri
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
  /api/auth/sso/basic-consume:
    get:
      summary: 浏览器消费 Basic 单点登录交接码
      tags:
      - Auth
      security: []
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 登录桥接页，写入 AuraOA 本地登录态后跳转工作台
          content:
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /api/tenants/list:
    get:
      summary: 获取公开租户列表（登录页）
      tags:
      - Auth
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TenantPublic'
  /api/auth/logout:
    post:
      summary: 登出
      tags:
      - Auth
      security:
