          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: success
      description: 使用 limit/offset 分页，非 page/page_size
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      - name: unread_only
        in: query
        schema:
          type: boolean
  /api/auth/notifications/read-all:
