components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Authorization: Bearer <access_token>'
    embedToken:
      type: apiKey
      in: header
      name: X-Embed-Token
      description: OA 嵌入页访问令牌（租户级 embed_token）
    basicAuth:
      type: http
      scheme: basic
      description: 用户名格式 tenantCode/username，密码为租户 Basic 单点登录共享密码
  responses:
    ErrorResponse:
      description: 业务错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
          additionalProperties: true
        trace_id:
          type: string
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          example: 40001
        message:
          type: string
        trace_id:
          type: string
    PagedResult:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        total:
          type: integer
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
        tenant_id:
          type: string
          format: uuid
        preferred_role:
          type: string
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        user:
          type: object
        roles:
          type: array
          items:
            type: object
        active_role:
          type: object
        permissions:
          type: array
          items:
            type: string
    TenantPublic:
      type: object
      properties:
        id:
          type: string
